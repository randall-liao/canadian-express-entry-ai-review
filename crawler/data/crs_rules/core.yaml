rows:
  # ===================================================================== #
  # A. CORE / HUMAN CAPITAL  (factor group core_human_capital)
  # Grounded from the current CRS criteria grid + language/ECA guidance.
  # Volatile numbers live ONLY in machine_check payloads + verbatim quotes.
  # ===================================================================== #

  - rule_id: core.age.table
    factor_group: core_human_capital
    factor_ids: [core.age]
    check_type: points
    query: years of age spouse
    selector:
      family: guidance
      marker: "20 to 29 years of age"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
    claim_text: >-
      Age on the date of the invitation to apply maps to the CRS age points
      table, which differs for candidates with and without an accompanying
      spouse or common-law partner.
    citations:
      - chunk_id: guidance/crs-criteria.md#004
        quote: "20 to 29 years of age  | 100  | 110"
    machine_check:
      kind: points_table
      field: age_years
      points_by_level:
        - label: peak_with_spouse
          level: "20-29"
          points: 100
          citation_index: 0
        - label: peak_without_spouse
          level: "20-29"
          points: 110
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: core.education.table
    factor_group: core_human_capital
    factor_ids: [core.education]
    check_type: points
    query: years of age spouse
    selector:
      family: guidance
      marker: "Secondary diploma (high school graduation)"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
        - guidance/summary
        - guidance/fact-sheet
    claim_text: >-
      Highest completed level of education maps to the CRS education points
      table (spouse and no-spouse columns).
    citations:
      - chunk_id: guidance/crs-criteria.md#004
        quote: "Secondary diploma (high school graduation)  | 28  | 30"
    machine_check:
      kind: points_table
      field: education_level
      points_by_level:
        - label: secondary_with_spouse
          level: secondary
          points: 28
          citation_index: 0
        - label: secondary_without_spouse
          level: secondary
          points: 30
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: core.education.eca_validity
    factor_group: core_human_capital
    factor_ids: [core.education]
    check_type: threshold
    query: ECA validity years profile
    selector:
      family: guidance
      marker: "less than 5 years"
      deny_families:
        - guidance/express-entry-year-end-report
    claim_text: >-
      A foreign educational credential assessment (ECA) must be under the
      validity window at profile creation and application; an expired ECA is
      refused.
    citations:
      - chunk_id: guidance/education-assessment.md#003
        quote: "Your ECA must be **less than 5 years** old when you"
    machine_check:
      kind: validity_window
      field: eca_report_date
      window_days: 1825
      citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: core.education.eca_designated
    factor_group: core_human_capital
    factor_ids: [core.education]
    check_type: admissibility
    query: foreign educational credential equivalency assessment
    selector:
      family: eca
      marker: "must submit a completed foreign educational credential"
    claim_text: >-
      A foreign credential must be substantiated by an Educational Credential
      Assessment report from a designated organization or professional body.
    citations:
      - chunk_id: eca/educational-credential-assessment.md#000
        quote: "must submit a completed foreign educational credential and an equivalency assessment"
    machine_check:
      kind: policy_flag
      field: eca_designated_required
      flag_value: true
      citation_index: 0
    volatility:
      volatility: stable
      source_family: eca
      crawl_date: "2026-06-11T01:09:52Z"

  - rule_id: core.language.first.approved_test
    factor_group: core_human_capital
    factor_ids: [core.language.first]
    check_type: admissibility
    query: prove language skills approved test
    selector:
      family: guidance
      marker: "approved language test"
      deny_families:
        - guidance/express-entry-year-end-report
    claim_text: >-
      First official language proficiency must be proven with an approved
      language test taken with an IRCC-approved agency.
    citations:
      - chunk_id: guidance/language-test.md#001
        quote: "You must prove your language skills by taking an approved language test."
    machine_check:
      kind: policy_flag
      field: approved_test_required
      flag_value: true
      citation_index: 0
    volatility:
      volatility: stable
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: core.language.first.accepted_tests
    factor_group: core_human_capital
    factor_ids: [core.language.first]
    check_type: admissibility
    query: approved language tests
    selector:
      family: guidance
      marker: "You can take any of these approved language tests"
      deny_families:
        - guidance/express-entry-year-end-report
    claim_text: >-
      The accepted first-official-language tests are CELPIP-General, IELTS
      General Training, PTE Core (English) and TEF Canada, TCF Canada (French).
    citations:
      - chunk_id: guidance/language-test.md#002
        quote: "You can take any of these approved language tests:"
      - chunk_id: guidance/language-test.md#002
        quote: "You must take the **IELTS General Training** option."
    machine_check:
      kind: accepted_enum
      field: test_type
      accepted_values:
        - value: CELPIP-General
          citation_index: 0
        - value: IELTS General Training
          citation_index: 1
        - value: PTE Core
          citation_index: 0
        - value: TEF Canada
          citation_index: 0
        - value: TCF Canada
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: core.language.first.validity
    factor_group: core_human_capital
    factor_ids: [core.language.first]
    check_type: threshold
    query: test results less than years old
    selector:
      family: guidance
      marker: "less than 2 years old"
      deny_families:
        - guidance/express-entry-year-end-report
    claim_text: >-
      Language test results must be within the validity window at profile
      creation and at application; expired results are not accepted.
    citations:
      - chunk_id: guidance/language-test.md#009
        quote: "Your test results must be **less than 2 years old** when you"
    machine_check:
      kind: validity_window
      field: test_date
      window_days: 730
      citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

