        - {label: applicant_study, level: "2 academic years", points: 5, citation_index: 2}
        - {label: spouse_study, level: "2 academic years", points: 5, citation_index: 3}
        - {label: applicant_work, level: "1 year", points: 10, citation_index: 4}
        - {label: spouse_work, level: "1 year", points: 5, citation_index: 5}
        - {label: arranged_employment, level: eligible, points: 5, citation_index: 6}
        - {label: relative, level: eligible, points: 5, citation_index: 7}
