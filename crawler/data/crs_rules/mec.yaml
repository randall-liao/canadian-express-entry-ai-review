        quote: "award the applicant up to a maximum of 10 points for adaptability"
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#001
        quote: "Award 5 points if the accompanying spouse or common-law partner, other than a permanent resident residing in Canada or a Canadian citizen, has a level of proficiency in either official language at **Canadian Language Benchmarks (CLB) level 4** or higher in all 4 language skill areas"
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#002
        quote: "Award 5 points if the principal applicant completed at least 2 academic years of full-time study (in a program of at least 2 years in duration) at a secondary or post-secondary institution in Canada."
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#002
        quote: "Award 5 points if the accompanying spouse or common-law partner, other than a permanent resident residing in Canada or a Canadian citizen, completed at least 2 academic years of full-time study (in a program of at least 2 years in duration) at a secondary or post-secondary institution in Canada."
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#003
        quote: "Award 10 points if the principal applicant completed at least 1 year of full-time work in Canada authorized under a work permit or under section R186"
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#004
        quote: "Award 5 points if the accompanying spouse or common-law partner, other than a Canadian citizen or permanent resident residing in Canada, completed at least 1 year of full-time work in Canada authorized under a work permit or under R186."
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#004
        quote: "Award 5 points if the principal applicant has been awarded points for arranged employment in Canada under subsection R82(2)."
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-selection-criteria-adaptability.md#004
        quote: "Award 5 points if the principal applicant, or accompanying spouse or common-law partner, has a relative (parent, grandparent, child, grandchild, sibling, aunt, uncle, niece or nephew) who is 18 years of age or older as of the date of application, and who is a Canadian citizen or permanent resident residing in Canada."
    machine_check:
      kind: points_table
      field: fsw_adaptability_grid
      points_by_level:
