  - rule_id: fsw.grid.arranged_employment
    factor_group: program_eligibility
    factor_ids: [fsw.grid.arranged_employment]
    check_type: points
    query: "job offer Canadian employer"
    selector:
      <<: *guidance_fsw
      marker: "To get 10 points for a valid job offer"
    claim_text: "Arranged-employment points remain manual because the cited ability-to-perform and licensing determinations must be made by an officer."
    citations:
      - chunk_id: guidance/federal-skilled-workers.md#015
        quote: "To get 10 points for a valid job offer, **one of these situations** must also apply."
      - chunk_id: guidance/federal-skilled-workers.md#015
        quote: "for continuous, paid, full-time work (minimum of 30 hours/week) that is: \n    * not seasonal\n    * for at least 1 year\n  * in an occupation listed in TEER category 0, 1, 2 or 3 of the NOC"
      - chunk_id: guidance/federal-skilled-workers.md#016
        quote: "You currently work in Canada on a work permit and you meet **all** of the following conditions: \n  * Your work permit is valid both when you apply and when the permanent resident visa is issued (or you’re allowed to work in Canada without a work permit when your visa is issued).\n  * We issued your work permit based on a positive labour market impact assessment (LMIA) from Employment and Social Development Canada in an occupation listed in TEER category 0, 1, 2 or 3 of the NOC.\n  * You’re working for an employer named on your work permit.\n  * That employer has made a valid job offer based on you being accepted as a skilled worker."
      - chunk_id: guidance/federal-skilled-workers.md#017
        quote: "You currently work in Canada in a job that is exempt from the LMIA requirement because of **1** of the following:\n  * an international agreement (such as, the North American Free Trade Agreement) or\n  * significant benefit to Canadian interests or\n  * a federal-provincial agreement"
      - chunk_id: guidance/federal-skilled-workers.md#018
        quote: "You must meet **all** of the following conditions:\n  * You currently don’t have a work permit, or don’t plan to work in Canada before you get a permanent resident visa.\n  * An employer has a LMIA. \n  * That employer has made you a valid job offer based on that LMIA and on you being accepted as a skilled worker."
      - chunk_id: guidance/federal-skilled-workers.md#019
        quote: "You must meet **all** of the following conditions:\n  * You have a valid work permit or are allowed to work in Canada without a work permit.\n  * You’re currently working in Canada in a job that is exempt from a LMIA, but it is **not** under an international, federal-provincial agreement or because of significant benefit to Canadian interests.\n  * An employer other than the one you are currently working for:\n    * has a LMIA\n    * has made you a valid job offer based on that LMIA and on you being accepted as a skilled worker. "
      - chunk_id: guidance/federal-skilled-workers.md#017
        quote: "Your work permit is valid both when you apply and when the permanent resident visa is issued (or you’re allowed to work in Canada without a permit when your permanent resident visa is issued).\n  * Your current employer has made a valid job offer based on you being accepted as a skilled worker.\n  * You are currently working for the employer specified on your work permit.\n  * You have been working for that employer for at least 1 year, continuous full-time or part-time equivalent."
      - chunk_id: guidance/federal-skilled-workers.md#015
        quote: "You can get points if you have a job offer of **at least 1 year** from a Canadian employer."
      - chunk_id: guidance/job-offer.md#003
        quote: "A valid job offer has to be:\n  * from 1 employer"
      - chunk_id: pr-pdi/economic-classes-federal-skilled-workers-arranged-employment-licensing-certification.md#000
        quote: "However, officers must be satisfied that the applicant is likely to accept and capable of performing the employment being offered to them, and can with reasonable probability be expected to qualify for licensing/certification once in Canada. In making this determination, visa officers may take into account the applicant’s education and training, background, and prior work experience."
    machine_check:
      kind: points_table
      field: fsw_arranged_employment_grid
      points_by_level:
        - {label: valid_arranged_employment, level: valid_offer, points: 10, citation_index: 0}
