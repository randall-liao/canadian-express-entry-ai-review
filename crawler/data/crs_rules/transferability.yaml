rows:
  # ===================================================================== #
  # C. SKILL TRANSFERABILITY  (factor group skill_transferability)
  # Combination rows recombine already-substantiated core evidence; each
  # combination depends on grounded CLB/year tiers, and three grounded CAP
  # rows (education 50, foreign-work 50, total 100) let Plan 31-04 clamp from
  # grounded values, never literals.
  # ===================================================================== #

  - rule_id: transfer.education_language
    factor_group: skill_transferability
    factor_ids: [transfer.education_language, core.education, core.language.first]
    check_type: points
    query: post-secondary degree official languages proficiency
    selector:
      family: guidance
      marker: "With good official language proficiency (Canadian Language Benchmark Level [CLB] 7 or higher) and a post-secondary degree"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
        - guidance/summary
        - guidance/fact-sheet
    claim_text: >-
      Education combined with first-official-language proficiency awards
      transferability points on a two-tier ladder, where the higher tier needs
      the higher benchmark on all four abilities; use the first official
      language only and one ability below the threshold breaks the combination.
    citations:
      - chunk_id: guidance/crs-criteria.md#014
        quote: "With good official language proficiency (Canadian Language Benchmark Level [CLB] 7 or higher) and a post-secondary degree"
    machine_check:
      kind: points_table
      field: education_x_language
      points_by_level:
        - label: lower_tier_clb7
          level: 7
          points: 25
          citation_index: 0
        - label: upper_tier_clb9
          level: 9
          points: 50
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: transfer.education_work
    factor_group: skill_transferability
    factor_ids: [transfer.education_work, core.education, core.work]
    check_type: points
    query: education Canadian work experience post-secondary degree
    selector:
      family: guidance
      marker: "With Canadian work experience and a post-secondary degree"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
        - guidance/summary
        - guidance/fact-sheet
    claim_text: >-
      Education combined with Canadian work experience awards transferability
      points on a two-tier ladder keyed to the number of years of Canadian work;
      both component factors must be independently substantiated.
    citations:
      - chunk_id: guidance/crs-criteria.md#014
        quote: "With Canadian work experience and a post-secondary degree"
    machine_check:
      kind: points_table
      field: education_x_canadian_work
      points_by_level:
        - label: one_year_tier
          level: "1"
          points: 25
          citation_index: 0
        - label: two_plus_year_tier
          level: "2+"
          points: 50
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: transfer.foreign_language
    factor_group: skill_transferability
    factor_ids: [transfer.foreign_language, core.language.first]
    check_type: points
    query: foreign work experience official language
    selector:
      family: guidance
      marker: "Points for foreign work experience + CLB 9 or more on all four first official language abilities"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
        - guidance/summary
        - guidance/fact-sheet
    claim_text: >-
      Foreign work experience combined with first-official-language proficiency
      awards transferability points on a two-tier ladder keyed to years of
      foreign work and the language benchmark on all four abilities.
    citations:
      - chunk_id: guidance/crs-criteria.md#016
        quote: "Points for foreign work experience + CLB 9 or more"
    machine_check:
      kind: points_table
      field: foreign_work_x_language
      points_by_level:
        - label: lower_tier
          level: 7
          points: 25
          citation_index: 0
        - label: upper_tier
          level: 9
          points: 50
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: transfer.foreign_work
    factor_group: skill_transferability
    factor_ids: [transfer.foreign_work, core.work]
    check_type: points
    query: foreign work experience Canadian work experience
    selector:
      family: guidance
      marker: "Points for foreign work experience + 2 years or more of Canadian work experience"
      deny_families:
        - guidance/grid
        - guidance/express-entry-year-end-report
        - guidance/express-entry-midyear
        - guidance/summary
        - guidance/fact-sheet
    claim_text: >-
      Foreign work experience combined with Canadian work experience awards
      transferability points on a two-tier ladder; overlapping or double-counted
      hours must be avoided and the foreign-work-combination cap applies.
    citations:
      - chunk_id: guidance/crs-criteria.md#017
        quote: "Points for foreign work experience + 2 years or more of Canadian work experience"
    machine_check:
      kind: points_table
      field: foreign_work_x_canadian_work
      points_by_level:
        - label: lower_tier
          level: "1"
          points: 25
          citation_index: 0
        - label: upper_tier
          level: "2+"
          points: 50
          citation_index: 0
    volatility:
      volatility: volatile
      source_family: guidance
      crawl_date: "2026-06-11T01:09:06Z"

  - rule_id: transfer.certificate_language
    factor_group: skill_transferability
