[project]
name = "corpus-crawler"
version = "2.0.0"
description = "Config-driven, grounded-corpus crawler for authoritative immigration sources (IRCC / IRPA / IRPR / PDIs)."
readme = "crawler/README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "PR Review Agents contributors" },
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "pydantic (>=2.13,<3.0)",
    "platformdirs (>=4.10,<5.0)",
    "github-copilot-sdk>=1.0.8,<1.1.0",
]

[project.optional-dependencies]
crawl = [
    "crawl4ai>=0.8.9,<0.9.0",
]
doc-extract = [
    "pypdfium2>=5.11,<6.0",
    "Pillow>=12.3,<13.0",
    "pdfminer.six>=20260107,<20270000",
    "reportlab>=4.4,<6.0",
]
ocr = [
    "pytesseract>=0.3.13,<0.4.0",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"

[project.scripts]
corpus-crawler = "crawler.cli:entrypoint"

[tool.poetry]
packages = [{ include = "crawler" }]
exclude = ["crawler/tests", "crawler/**/__pycache__"]

[tool.pytest.ini_options]
markers = [
    "conformance: v5 release-gate safety conformance suite (SAFE-01..12)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
